# Publishes to npm when the version in package.json changes on main, then tags the commit and creates the GitHub
# release. To release: bump "version" in package.json (and package-lock.json), merge to main, done.
#
# Auth is npm Trusted Publishing (OIDC): no npm token is stored anywhere. One-time setup on npmjs.com, on the package's
# Settings page: Trusted Publisher > GitHub Actions > this organization, this repository, workflow file "release.yml".
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the tag and GitHub release
  id-token: write # npm Trusted Publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Is this version on npm yet?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm, nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $NAME@$VERSION."
          fi

      - name: Install
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Type check
        if: steps.check.outputs.publish == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      # Trusted Publishing needs npm 11.5.1 or later.
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public

      - name: Tag and GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.check.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.check.outputs.version }}" --generate-notes
